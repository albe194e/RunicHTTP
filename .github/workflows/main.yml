name: Odin Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Install jq (for fetching dynamic URLs)
      - name: Install jq
        run: sudo apt-get install -y jq

      # Fetch and install Odin Compiler
      - name: Install Odin Compiler
        run: |
          mkdir -p $HOME/odin
          LATEST_URL=$(curl -s https://api.github.com/repos/odin-lang/Odin/releases/latest | jq -r '.assets[] | select(.name | endswith("ubuntu-amd64-dev.zip")) | .browser_download_url')
          echo "Downloading Odin from $LATEST_URL"
          curl -L -o odin.zip $LATEST_URL
          unzip odin.zip -d $HOME/odin
          echo "$HOME/odin" >> $GITHUB_PATH

      # Verify Odin installation
      - name: Verify Odin Installation
        run: odin version

      # Debug Odin directory structure (optional)
      - name: Debug Odin Installation
        run: ls -R $HOME/odin

      # Run Odin tests
      - name: Run Tests
        run: |
          odin test tests/ -all-packages
